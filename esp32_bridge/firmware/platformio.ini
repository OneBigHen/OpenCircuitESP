[platformio]
default_envs = esp32dev

[env]
; Requires PlatformIO Core 6.2.0 or newer. Pin the release, not mutable stable.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
; One 2 MiB app slot + 1.94 MiB LittleFS on minimum 4 MiB modules.
; The stock 1.25 MiB partition overflowed on both WROOM and C6.
lib_deps = h2zero/NimBLE-Arduino @ 2.5.1
build_flags = -DCORE_DEBUG_LEVEL=1

[env:esp32dev]
board = esp32dev

[env:esp32c6]
board = esp32-c6-devkitc-1
